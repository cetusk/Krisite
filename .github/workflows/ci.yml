# Krisite — CI
#
# SPEC-phase0.md §9:
#   「Linux(GCC/Clang) / macOS(Apple Silicon) / Windows(MSVC) でビルドが通る
#     → 開発コンテナではなく CI（GitHub Actions のマトリクス）で確認すること。」
#
# 開発コンテナには GCC も MSVC も入れません。プラットフォーム検証はここが正です。

name: CI

# **文書だけの変更では回しません。** ビルド入力が 1 つも変わらないなら、
# 検証すべきものがありません（実例: ROADMAP だけの PR で 20 ジョブ 8 分を回していた）。
#
# **判定は「変更されたファイルが全部この一覧に収まるとき」です。** コードと文書が
# 混ざった変更は通常どおり全部走ります。**範囲を減らす手当てではありません。**
#
# `.github/workflows/**` は除外しません。CI 自身の変更は CI で確かめます。
# **`push` は `main` だけです。** フェーズ用ブランチ（`phase2/**` など）への push では
# CI を回しません。**ためて、キリの良いところで PR を開いて一気に回す**運用のためです。
#
# 途中で確かめたくなったら `workflow_dispatch` で手動実行できます。
#
# **代償: PR を開くまで一度も検証されません。** ローカルで検証できない領域
# （`arith/intrinsics.hpp`、CMake、依存の追加）に触った回は、ためずに早めに
# 手動実行するか PR を開いてください。MSVC のビルドエラーを 20 コミット後に
# まとめて受け取ると、切り分けに時間がかかります。
on:
  push:
    branches: [main]
    # **アンカー（&/*）は使えません。** GitHub Actions のワークフロー構文は
    # YAML のアンカーを解決しないので、同じ一覧を 2 度書きます。
    # **片方だけ直すと push と PR で挙動がずれます。両方直すこと。**
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "assets/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "assets/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

# 同じブランチで push が続いたら、古い実行を打ち切る。
# **main では打ち切りません**（マージ済みの結果は残す）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---- 変更の範囲（`ROADMAP.md`「CI の方針」の影響トリガ）---------------------
  #
  # **ジョブごとのパス条件は `on:` では書けません**（`paths` はワークフロー単位）。
  # そこで先頭で 1 度だけ判定し、各ジョブが `if:` で参照します。
  # **第三者アクションは使いません**（`CLAUDE.md`「GitHub 純正と標準パッケージで
  # 組めるなら、そちらを優先する」）。
  #
  # **トリガは広めに取ります。迷ったら含める。**
  # `csg/` の変更が MSVC を壊すのに `arith/` を触っていない、という組合せは普通に
  # あります。**main ゲートが最後の網**です。
  changes:
    name: 変更の範囲
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.f.outputs.code }}
      mutation: ${{ steps.f.outputs.mutation }}
      semantics: ${{ steps.f.outputs.semantics }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        run: |
          set -uo pipefail
          # **PR 以外（main への push / 手動実行）は全部回します。** main ゲートです。
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "PR ではないので全ジョブを回します"
            printf 'code=true\nmutation=true\nsemantics=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "$base^{commit}" 2>/dev/null || \
            git fetch --no-tags --depth=1 origin "$base"
          files=$(git diff --name-only "$base" HEAD) || files=""
          # **差分が取れなかったら安全側に倒します**（`CLAUDE.md`「失敗の向きを
          # 安全側に」）。`set -e` を使えない構造なので、`git diff` が黙って失敗すると
          # 全部 false になり、**全ジョブが skip されてワークフローは緑**になります。
          # 空振り 1 回のコストより、網が黙って消えるほうが高くつきます。
          if [ -z "$files" ]; then
            echo "差分が取れませんでした。安全側に倒して全ジョブを回します" >&2
            printf 'code=true\nmutation=true\nsemantics=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "--- 変更されたファイル ---"
          echo "$files"
          has() { echo "$files" | grep -qE "$1"; }
          code=false; mutation=false; semantics=false
          # ビルドできる形が変わり得るもの（テストコードも MSVC を壊します）
          has '^(include/|tests/|CMakeLists\.txt|\.github/workflows/)' && code=true
          # 変異が守るのは**テスト自身の検出力**。壊れるのはテストとコーパスの変更
          has '^(tests/|include/krisite/(csg|mesh|octree)/|CMakeLists\.txt|\.github/workflows/)' && mutation=true
          # 意味論（Manifold との突き合わせ）
          has '^(tests/|include/krisite/(csg|mesh)/|\.github/workflows/)' && semantics=true
          echo "--- 判定 ---"
          printf 'code=%s\nmutation=%s\nsemantics=%s\n' "$code" "$mutation" "$semantics" \
            | tee -a "$GITHUB_OUTPUT"

  # ---- PR ゲート（毎 PR。`ROADMAP.md`「CI の方針」）---------------------------
  #
  # **主要 1 構成の全テスト。** ここだけは常に回します。
  pr-gate:
    name: PR ゲート (Linux Clang, b=21)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401  # v5
      # **毎 PR で必ず走るジョブなので、ccache が最も効きます。**
      - uses: ./.github/actions/ccache
        with:
          key: pr-gate
      - name: 構成
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DKRISITE_COORD_BITS=21 \
            -DKRISITE_CHECKED_ARITH=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build build
      - run: ctest --test-dir build --no-tests=error --output-on-failure --parallel 4
      - name: ccache の効き
        run: ccache -s | head -12

  # ---- プラットフォーム検証（§9 の 2 番目の条件）------------------------------
  #
  # GMP はテスト専用かつプラットフォームごとの入手性が違うので、ここでは OFF。
  # GMP 差分テストは下の gmp ジョブ（Linux）で回す。
  build:
    name: ${{ matrix.name }} (b=${{ matrix.coord_bits }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    # **b=26 が固有に検証するのはリム数の違いです**（`cmp_h` が 5 → 6 リム）。
    # これはプラットフォームに依らないので、**全構成でビルドはするが、テストは
    # 幅に関わるものだけ**に絞ります（`tests: width`）。
    #
    # **Linux Clang の b=26 だけは全テストを回します。** 幾何配置での上界超過は
    # 検査 ON の幾何コーパスが網なので、1 構成は残す必要があります。
    #
    # 絞り方は**除外ラベル**です（`CLAUDE.md`「対象外に印を付ける」）。
    # ラベルを付け忘れたテストは**走ります**。網が黙って縮みません。
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: gcc21,   name: "Linux GCC",    os: ubuntu-24.04, cc: gcc-13,   cxx: g++-13,     coord_bits: 21, tests: full  }
          - { id: gcc26,   name: "Linux GCC",    os: ubuntu-24.04, cc: gcc-13,   cxx: g++-13,     coord_bits: 26, tests: width }
          - { id: clang26, name: "Linux Clang",  os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, coord_bits: 26, tests: full  }
          - { id: mac21,   name: "macOS arm64",  os: macos-14,     cc: clang,    cxx: clang++,    coord_bits: 21, tests: full  }
          - { id: mac26,   name: "macOS arm64",  os: macos-14,     cc: clang,    cxx: clang++,    coord_bits: 26, tests: width }
          - { id: msvc21,  name: "Windows MSVC", os: windows-2022, cc: "",       cxx: "",         coord_bits: 21, tests: full  }
          - { id: msvc26,  name: "Windows MSVC", os: windows-2022, cc: "",       cxx: "",         coord_bits: 26, tests: width }

    steps:
      - uses: actions/checkout@v4

      - name: Ninja を用意
        uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401  # v5

      - name: MSVC 環境を用意
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1

      # **合成アクションは apt に依存するので Linux だけです。**
      # macOS / Windows でも使いたくなったら、パッケージ導入の分岐を
      # `.github/actions/ccache` 側に足してください（ここに書かないこと）。
      - name: ccache（Linux のみ）
        if: runner.os == 'Linux'
        uses: ./.github/actions/ccache
        with:
          key: build-${{ matrix.id }}

      - name: 構成
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DKRISITE_COORD_BITS=${{ matrix.coord_bits }} \
            -DKRISITE_CHECKED_ARITH=ON \
            ${{ runner.os == 'Linux' && '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}

      - name: ビルド
        run: cmake --build build

      - name: テスト（GMP 非依存の分）
        # `tests: width` の構成では**重い幾何テストを除外**します。
        # 向きは `CLAUDE.md`「対象外に印を付ける」に従い、**付け忘れたテストは走ります。**
        run: >
          ctest --test-dir build --no-tests=error --output-on-failure --parallel 4
          ${{ matrix.tests == 'width' && '-LE heavy_geometry' || '' }}

  # ---- 適応分割モード（SPEC-phase2 §9.4）------------------------------------
  #
  # **固定深度モードも残します**（§0.1 の正解器として必要）。ここは既定を
  # 「適応分割 + early-out + 構成点の保持」に反転させ、**Phase 1 の検査体系が
  # 適応分割モードでも全通過する**ことを確かめるジョブです（§9.2）。
  #
  # **空回りしないことを cp3 が検査します。** 既定を反転させても、テストが構成を明示して
  # いれば何も変わりません。適応分割モードでは葉の深さに差が出ていることを確かめます。
  #
  # **b=26 は回しません。** 適応分割の論理にビット幅は関与しないので、b=26 で固有に
  # 出るものがありません（幅の網は build 行列の b=26 が持ちます）。
  adaptive:
    name: 適応分割モード (§9.4, b=${{ matrix.coord_bits }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        coord_bits: [21]
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401  # v5
      - uses: ./.github/actions/ccache
        with:
          key: adaptive
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DKRISITE_COORD_BITS=${{ matrix.coord_bits }} \
            -DKRISITE_CHECKED_ARITH=ON \
            -DKRISITE_DEFAULT_ADAPTIVE=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build build
      - run: ctest --test-dir build --no-tests=error --output-on-failure --parallel 4
      # **空回りの番人が実際に働いたことをログに残す。**
      - name: 適応分割が効いていることを確認
        run: ctest --test-dir build --no-tests=error -R '^cp3$' -V | grep -F "§9.4 適応分割モード"

  # ---- 検査ビルド（Debug では KRISITE_CHECKED_ARITH が自動で ON）--------------
  # **Debug が固有に検証するのは「検査が自動で ON になる」ことだけです。**
  # 検査そのものは build 行列（RelWithDebInfo + CHECKED_ARITH=ON）が回しています。
  # そこで**コンパイル行に `KRISITE_CHECKED_ARITH=1` が入っていることを直接見て**、
  # 実行は arith の 2 本に絞ります。**文書ではなく機構で確かめる形**です。
  debug-checked:
    name: Linux Debug (検査自動 ON)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401  # v5
      # **`-v` でコンパイル行を見るジョブなので、ccache を通しても行は変わりません。**
      - uses: ./.github/actions/ccache
        with:
          key: debug-checked
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Debug で検査が自動 ON になること
        run: |
          cmake --build build -v --target bitwidth 2>&1 | tee build.log
          grep -q "KRISITE_CHECKED_ARITH=1" build.log || {
            echo "Debug なのにコンパイル行に KRISITE_CHECKED_ARITH=1 がありません" >&2
            exit 1
          }
          echo "OK: Debug で検査が自動 ON"
      - run: cmake --build build --target fixed_int
      - run: ctest --test-dir build --no-tests=error -R '^(bitwidth|fixed_int)$' --output-on-failure

  # ---- sanitizer（UBSan / ASan）----------------------------------------------
  #
  # **出荷時の構成（検査 OFF）での未定義動作を直接見ます。**
  # `KRISITE_CHECKED_ARITH=ON` は溢れを表明で止めるので、**検査を切った経路の UB は
  # どのジョブも見ていませんでした。** Debug（-O0）が偶然露出させるのを待つより、
  # sanitizer で直接検出するほうが確かです。
  sanitizers:
    name: UBSan / ASan (検査 OFF)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401  # v5
      - uses: ./.github/actions/ccache
        with:
          key: sanitizers
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DKRISITE_CHECKED_ARITH=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build build
      - env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        # **並列度を落としています。** ASan は影のメモリを確保するので、
        # 4 並列だと 4 コア / 16GB のランナーで OOM に当たり得ます。
        # OOM は「テストが落ちた」と区別が付きにくいので、ここは安全側に倒します。
        run: ctest --test-dir build --no-tests=error --output-on-failure --parallel 2
      - name: ccache の効き
        run: ccache -s | head -12

  # ---- 可搬フォールバック経路（__int128 / 32bit 筆算）------------------------
  #
  # SPEC §5.3 の 3 経路のうち、x86-64 組み込みを使わない 2 つを実際に走らせる。
  # MSVC ARM64 相当（__int128 も _umul128 も無い）は KRISITE_NO_INT128 で再現する。
  #
  # **フォールバックが変えるのは arith の実装だけです。** 幾何コーパスを 2 回追加で
  # 回しても、直接の網（`fixed_int` と GMP 差分 10^7 件）以上のものは出ません。
  # **重い幾何テストは除外**します（除外ラベル。付け忘れたテストは走ります）。
  fallback-paths:
    name: 可搬経路 (${{ matrix.flags }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: nointr,     flags: "-DKRISITE_NO_INTRINSICS" }
          - { key: noint128,   flags: "-DKRISITE_NO_INTRINSICS -DKRISITE_NO_INT128" }
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401  # v5
      # 鍵にフラグを含めます。**経路が違えば別のオブジェクトなので、混ぜると命中しません。**
      - uses: ./.github/actions/ccache
        with:
          key: fallback-${{ matrix.key }}
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DKRISITE_CHECKED_ARITH=ON -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build build
      - run: ctest --test-dir build --no-tests=error --output-on-failure --parallel 4 -LE heavy_geometry

  # ---- GMP 差分テスト（LGPL、テスト専用）------------------------------------
  gmp:
    name: GMP 差分テスト (b=${{ matrix.coord_bits }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        coord_bits: [21, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401  # v5
      - uses: ./.github/actions/ccache
        with:
          key: gmp-${{ matrix.coord_bits }}
      - name: GMP を導入
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DKRISITE_COORD_BITS=${{ matrix.coord_bits }} \
            -DKRISITE_CHECKED_ARITH=ON \
            -DKRISITE_BUILD_TESTS_WITH_GMP=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build build
      # SPEC §9: 算術 10^7 件、述語 10^6 件以上
      - run: ctest --test-dir build --no-tests=error --output-on-failure --parallel 4
      # 条件付きで登録されるテストは、登録されていなくても全体の ctest は緑になる。
      # 名前を指定して 1 件以上あることを確かめる（§10.3 の体積検査）。
      - name: §10.3 の体積検査が実際に走ったことを確認
        run: ctest --test-dir build --no-tests=error -R volume_gmp -V

      # SPEC §9: ライブラリ本体のバイナリに GMP がリンクされていないこと
      - name: 本体に GMP が入っていないことを確認
        run: |
          cmake -B build-nogmp -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DKRISITE_BUILD_TESTS=OFF -DKRISITE_BUILD_BENCH=ON
          cmake --build build-nogmp
          ldd build-nogmp/bench/pred_bench
          if ldd build-nogmp/bench/pred_bench | grep -q gmp; then
            echo "本体バイナリに GMP がリンクされています（ライセンス違反）" >&2
            exit 1
          fi

  # ---- ベンチマーク（数値は docs/BENCH.md に手で記録する）--------------------
  # ---- 変異テスト（SPEC-phase1 §10.5 / §10.6）--------------------------------
  #
  # **検査 OFF で回します。** 検査 ON だと変異 3 が KRISITE_CHECK で停止し、
  # 「テスト体系が検出するか」ではなく「表明が止めるか」を測ってしまいます。
  #
  # 期待値（検出する / しない）は tests/CMakeLists.txt に表として書いてあり、
  # ctest が WILL_FAIL で検証します。**素通りする組合せも固定しています。**
  mutation:
    name: 変異テスト (§10.5)
    needs: changes
    if: needs.changes.outputs.mutation == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401  # v5
      # **ccache は実測で入れました**（このジョブ: 4.7 分 → 1.2 分、命中 91/91）。
      - uses: ./.github/actions/ccache
        with:
          key: mutation
      - name: 構成
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DKRISITE_CHECKED_ARITH=OFF \
            -DKRISITE_BUILD_MUTANTS=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: ビルド
        run: cmake --build build
      - name: ccache の効き（ログに残す）
        run: ccache -s | head -12
      - name: 変異が期待どおり検出されること
        run: |
          # 期待する変異テストの件数。減っていたら「変異テストがある」だけの状態に
          # 戻っているので落とす。
          # **体積の変異は別ラベル（mutation_gmp）です**（SPEC-phase2 §9.4.1）。
          # ラベルは `^...$` で固定します。**`-L` は正規表現なので、
          # 素の `mutation` は `mutation_gmp` にも一致します。**
          # 体積の変異は下の mutation_gmp ジョブが回します。
          #
          # **件数は `Total Tests:` から取ります。** `grep -c "Test #"` は使わないこと —
          # `ctest -N` はテスト番号を右詰めで揃えるので、総テスト数が桁上がりすると
          # 空白の数が変わり、**最大桁のものしか数えません。** 実際 100 件を跨いだ
          # 時点で 71 → 3 に見えました（番人が黙って壊れる形です）。
          n=$(ctest --test-dir build -N -L '^mutation$' | sed -n 's/^Total Tests: *//p')
          echo "登録されている変異テスト: $n 件"
          test "$n" -eq 76 || { echo "変異テストの件数が想定と違います（期待 76）"; exit 1; }
          ctest --test-dir build --no-tests=error -L '^mutation$' --output-on-failure --parallel 4
      - name: 変異 3 は検査ビルドでは表明が止めること
        # もう一方の検出経路。位相検査に届く前に fragment_sign の不変条件が落とす。
        # **同じ誤りを 2 つの独立した機構が捕まえる**ことの確認（§10.5）。
        run: |
          g++ -std=c++20 -O1 -Iinclude -Itests \
            -DKRISITE_COORD_BITS=21 -DKRISITE_CHECKED_ARITH=1 \
            -DKRISITE_MUTATION_LOCAL_PLANES=1 \
            tests/csg/test_cp2.cpp -o mut3_checked
          if ./mut3_checked > out.txt 2>&1; then
            echo "変異 3 が検査ビルドで素通りしました"; cat out.txt; exit 1
          fi
          grep -q "krisite: " out.txt || { echo "表明で止まっていません"; cat out.txt; exit 1; }
          echo "OK: 表明が停止させました"

  # ---- GMP 付きの変異テスト（SPEC-phase2 §9.4.1）------------------------------
  #
  # **体積が意味を持つ変異だけを GMP 付きで回します。** 変異ジョブ全体を GMP 付きに
  # しても、時間が増えるだけで検出力は増えません。
  #
  #   変異 6 / 7             体積が**検出器**（FAIL が期待値）
  #   変異 8 / 8a / 8b / 9   体積は**素通り**（PASS が期待値。§5.1.3 の定理）
  #
  # **素通りの側にも意味があります。** 「体積は分裂の誤りを検出しない」という
  # 役割分担を固定しているので、体積で拾えるようになったら（＝分裂が幾何を
  # 動かしたら）ここが落ちます。
  mutation_gmp:
    name: GMP 付き変異テスト (§9.4.1)
    needs: changes
    if: needs.changes.outputs.mutation == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401  # v5
      - uses: ./.github/actions/ccache
        with:
          key: mutation-gmp
      - name: GMP を導入
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: 構成
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DKRISITE_CHECKED_ARITH=OFF \
            -DKRISITE_BUILD_MUTANTS=ON \
            -DKRISITE_BUILD_TESTS_WITH_GMP=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: ビルド
        run: cmake --build build
      - name: 体積の変異が期待どおりであること
        run: |
          # **空回りの番人。** GMP が見つからなければ 0 件で緑になってしまう。
          # 件数の取り方は上のジョブと同じ理由で `Total Tests:` から取ります。
          n=$(ctest --test-dir build -N -L '^mutation_gmp$' | sed -n 's/^Total Tests: *//p')
          echo "登録されている GMP 変異テスト: $n 件"
          test "$n" -eq 8 || { echo "件数が想定と違います（期待 8）"; exit 1; }
          ctest --test-dir build --no-tests=error -L '^mutation_gmp$' --output-on-failure --parallel 4
      - name: ccache の効き
        run: ccache -s | head -12

  # ---- 外部正解器 Manifold（SPEC-phase1 §10.4 / §10.6）-----------------------
  #
  # **開発コンテナでは実施できません**（ネットワーク遮断 + git clone の deny）。
  # GitHub Actions にはネットワークがあるので、ここで実施します。
  # deny は緩めていません。
  manifold:
    name: Manifold 正解器 (§10.4)
    needs: changes
    if: needs.changes.outputs.semantics == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401  # v5
      - uses: ./.github/actions/ccache
        with:
          key: manifold
      - name: 構成（Manifold を FetchContent で取得）
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DKRISITE_BUILD_TESTS_WITH_MANIFOLD=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: 取得したコミットとライセンスを記録
        # LICENSE の実体を読んで確認する（README の記述を信用しない。THIRD_PARTY_LICENSES.md）。
        # 構成時にも FATAL_ERROR で検査しているが、根拠を CI ログに残す。
        run: |
          SRC=$(find build/_deps -maxdepth 1 -name 'manifold-src' -type d)
          GOT=$(git -C "$SRC" rev-parse HEAD)
          WANT=$(grep -oE '[0-9a-f]{40}' CMakeLists.txt | head -1)
          echo "commit: $GOT (固定値: $WANT)"
          test "$GOT" = "$WANT" || { echo "固定コミットと違うものを取得しました"; exit 1; }
          echo "--- LICENSE の冒頭 ---"
          head -5 "$SRC/LICENSE"
          grep -q "Apache License" "$SRC/LICENSE"
      - name: ビルド
        run: cmake --build build
      - name: 本体に Manifold が入っていないことを確認
        # krisite はヘッダオンリーの INTERFACE ライブラリなので、成果物に混ざる余地は
        # 本来ないが、テスト実行ファイル以外がリンクしていないことを機械的に確かめる。
        run: |
          for f in $(find build -name 'lib*.a' -o -name 'lib*.so'); do
            case "$f" in */manifold*|*/_deps/*) continue;; esac
            if nm -C "$f" 2>/dev/null | grep -q "manifold::"; then
              echo "本体成果物に Manifold のシンボルが混入: $f"; exit 1
            fi
          done
          echo "OK: 本体に Manifold は入っていません"
      - name: 突き合わせ
        # **--no-tests=error は必須です。** これが無いと、テストが 1 つも登録されて
        # いなくても ctest は 0 で終わり、ジョブは緑になります。実際に一度そうなり
        # ました（Manifold のブロックが add_subdirectory(tests) より後ろにあり、
        # KRISITE_MANIFOLD_FOUND が OFF のままテストが登録されていなかった）。
        #
        # -V で成功時も出力を残す。**何を比較したかがログに残らないと、
        # 「緑だった」以上のことが言えません。**
        run: |
          ctest --test-dir build --no-tests=error -R manifold_oracle -V

  bench:
    name: ベンチマーク（基準線）
    # **合否に使わない数値なので、main ゲートだけで足ります**（`ROADMAP.md`）。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401  # v5
      - run: |
          cmake -B build-rel -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DKRISITE_CHECKED_ARITH=OFF -DKRISITE_BUILD_BENCH=ON -DKRISITE_BUILD_TESTS=OFF
      - run: cmake --build build-rel
      # CI ランナーの数値は揺れるので合否には使わない。傾向の監視のみ。
      - run: ./build-rel/bench/pred_bench
      - run: ./build-rel/bench/arith_bench

  # ---- 書式 -------------------------------------------------------------------
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # ランナー既定の clang-format はバージョンが動くので固定する。
      # 上げるときは同じ版でローカルを整形し直してから CI を上げること。
      - run: pip install "clang-format==22.1.8"
      - run: |
          find include tests bench \( -name '*.hpp' -o -name '*.cpp' \) \
            | xargs clang-format --dry-run --Werror
